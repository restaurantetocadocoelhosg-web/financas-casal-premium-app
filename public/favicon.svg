  <g clip-path="url(#rounded)">
    <circle cx="20" cy="17" r="17" fill="#FFFFFF" opacity="0.10"/>
    <g filter="url(#innerglow)" opacity="0.55">
      <path d="M15.5 42 L27 30.5 L36.5 38 L47.5 22.5" fill="none" stroke="#FFF3D6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g filter="url(#shadow)">
