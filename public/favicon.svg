      <path d="M39 23 L47 23 L47 31" fill="none" stroke="url(#arrowfill)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="17" cy="41" r="3.1" fill="url(#arrowfill)"/>
